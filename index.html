  <body class="h-full bg-stone-950 text-stone-100 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture early beforeinstallprompt before React hydration
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });

      // Purge any stale service worker caches on startup to ensure React modules are never stale
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (!key.startsWith('trader24-v6')) {
              console.log('[PWA] Evicting stale cache:', key);
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              reg.update();
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New service worker version installed and available.');
                    }
                  };
                }
              };
            })
            .catch(err => {
              console.log('SW registration note:', err);
            });
        });
      }
    </script>
  </body>
